[package]
name = "gemini-terminal"
version = "0.1.0"
edition = "2021"

[dependencies]
# Backend
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
open = "5.3.4"
