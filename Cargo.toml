[package]
name = "gemini-terminal"
version = "0.3.2"

edition = "2021"
authors = ["jdesroches"]
description = "A standalone GTK4 terminal application for Gemini AI"

[dependencies]
gtk4 = "0.8"
vte4 = "0.7"
glib = "0.19"
gio = "0.19"
gdk4 = "0.8"
adw = { package = "libadwaita", version = "0.6" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "jdesroches"
copyright = "2026, jdesroches"
license-file = ["LICENSE", "0"]
depends = "$auto, libvte-2.91-gtk4-0, libadwaita-1-0"
section = "utils"
priority = "optional"
assets = [
    ["target/release/gemini-terminal", "usr/bin/gemini-terminal", "755"],
    ["assets/gemini-terminal.desktop", "usr/share/applications/gemini-terminal.desktop", "644"],
    ["assets/gemini_logo.svg", "usr/share/icons/gemini_logo.svg", "644"],
]
