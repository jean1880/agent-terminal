# cargo-nextest: every test in its own process, so one test's GTK, glib or global state can
# never leak into another's. Native cases (#[ignore]d, one display each) stay with
# tests/qa/gate.py, which runs them by exact name.

[profile.default]
# A test that hangs is a failure, not a stalled run: warn every 60 s, kill after 5 minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

# The store's randomised equivalence checks run hundreds of scripted stores each and take
# tens of seconds in a debug build. Started first, they overlap the rest of the suite
# instead of trailing after it.
[[profile.default.overrides]]
filter = "package(agent-kit) & test(/healing_from_tails|longer_than_the_heal_window/)"
priority = 100

# The git-backed tests each make real repositories in temp dirs and run git many times.
[[profile.default.overrides]]
filter = "package(agent-kit) & test(/::repo::/)"
priority = 50

[profile.ci]
# Report every failure in one run, not just the first.
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
