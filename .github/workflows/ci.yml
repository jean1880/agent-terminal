name: CI

on:
  push:
    branches: [master, "beta/**"]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every other run gets a group of its own,
# so a run on master or a release branch is never cancelled or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/quality-gate.yml

  # A coverage drop shows on the PR, not first at release.
  coverage:
    uses: ./.github/workflows/coverage.yml
