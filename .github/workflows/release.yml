name: Release

# A v* tag builds the Debian/Ubuntu, Fedora and Arch packages and publishes them, with checksums
# and the release notes, as a GitHub Release. Run by hand (workflow_dispatch), it is a dry run:
# every package is built and kept as a workflow artifact, and nothing is published.
#
# Each package is built by packaging/build-<kind>.sh in a clean container of its distribution,
# the same way it can be built locally:
#   docker run --rm -v "$PWD":/src:ro -v /tmp/out:/out -e OUT=/out fedora:42 \
#     bash /src/packaging/build-rpm.sh

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    uses: ./.github/workflows/quality-gate.yml

  # The full suite under coverage, held to the floor: no release on a partial run.
  coverage:
    uses: ./.github/workflows/coverage.yml

  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version, and check the tag matches it
        id: read
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::Tag $tag does not match Cargo.toml version $version (expected v$version)"
              exit 1
            fi
            notes="docs/releases/$tag.md"
            if [[ ! -s "$notes" ]]; then
              echo "::error::Missing release notes: $notes"
              exit 1
            fi
          fi

  build:
    name: Package (${{ matrix.kind }})
    needs: [version, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: fedora:42
          - kind: arch
            image: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the ${{ matrix.kind }} package
        run: bash packaging/build-${{ matrix.kind }}.sh
        env:
          OUT: ${{ github.workspace }}/dist

      - name: Record package and source identity
        run: python3 packaging/artifact-manifest.py create dist
        env:
          PACKAGE_SOURCE_COMMIT: ${{ github.sha }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  # Each package installed in a FRESH container of its distribution (not the build container,
  # which has every development library): a missing runtime dependency fails here, not for a user.
  smoke:
    name: Install test (${{ matrix.kind }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: fedora:42
          - kind: arch
            image: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.kind }}
          path: dist

      - name: Install it and run it
        run: bash packaging/smoke-install.sh dist

  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.tested_commit == github.sha && needs.coverage.outputs.tested_commit == github.sha
    needs: [version, gate, coverage, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Signed build provenance: an OIDC token for the Sigstore certificate, and the
      # attestation's storage.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Every file listed in SHA256SUMS gets a signed provenance attestation tying it to this
      # workflow run, commit and tag. Users check one with `gh attestation verify <file>
      # --repo jean1880/agent-terminal`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Agent Terminal $VERSION" \
            --notes-file "docs/releases/$TAG.md"
