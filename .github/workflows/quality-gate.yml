name: make check

on:
  workflow_call:
    outputs:
      tested_commit:
        description: Exact checkout commit that passed the source and native gate
        value: ${{ jobs.check.outputs.tested_commit }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      tested_commit: ${{ steps.gate.outputs.tested_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libvte-2.91-gtk4-dev libadwaita-1-dev \
            libgtksourceview-5-dev libglib2.0-dev-bin xvfb xauth dbus-x11 python3 \
            mesa-utils gdb
      # A test that dies by SIGILL on some runners and passes on others, same commit: record
      # the CPU and the GL renderer the display tests get, to tell the runners apart.
      - name: Describe the runner
        run: |
          lscpu
          xvfb-run -a glxinfo -B || true
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ux-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ux-gate-
      - name: make check
        id: gate
        env:
          NEXTEST_PROFILE: ci
        run: |
          tested=$(git rev-parse HEAD)
          make check
          # What passed is exactly the commit: nothing was edited or generated in the tree.
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git rev-parse HEAD)" = "$tested"
          echo "tested_commit=$tested" >> "$GITHUB_OUTPUT"
      # Diagnosis only (the job has already failed): where test_window_initialization's SIGILL
      # is raised, if it was the crash.
      - name: Rerun the crashing test under gdb
        if: failure() && steps.gate.outcome == 'failure'
        continue-on-error: true
        run: make test-gdb T=test_window_initialization
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-gate-${{ github.sha }}
          path: |
            target/qa-artifacts/
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
