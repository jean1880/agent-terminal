name: make coverage

# The whole suite (and the display tests) under instrumentation, held to COVERAGE_FLOOR in the
# Makefile. Runs on every PR; a release requires it on the exact release commit.
on:
  workflow_call:
    outputs:
      tested_commit:
        description: Exact checkout commit whose full coverage run held the floor
        value: ${{ jobs.coverage.outputs.tested_commit }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tested_commit: ${{ steps.coverage.outputs.tested_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libvte-2.91-gtk4-dev libadwaita-1-dev \
            libgtksourceview-5-dev libglib2.0-dev-bin xvfb xauth dbus-x11 python3
      - name: Install coverage tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148,cargo-llvm-cov@0.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-
      - name: make coverage
        id: coverage
        env:
          NEXTEST_PROFILE: ci
        run: |
          make coverage
          echo "tested_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: target/qa-artifacts/coverage/
          if-no-files-found: warn
          retention-days: 30
