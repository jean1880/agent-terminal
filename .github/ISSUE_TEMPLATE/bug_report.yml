# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Bug report
description: Something in Agent Terminal doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A bug that can be reproduced gets fixed first.

        - **A security problem?** Don't file it here. Use [private vulnerability reporting](https://github.com/jean1880/agent-terminal/security/advisories/new) (see [SECURITY.md](https://github.com/jean1880/agent-terminal/blob/master/SECURITY.md)).
        - **A problem in `claude`, `agy` or `codex` itself?** If it also happens when you run that CLI directly, report it to its vendor.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [open and closed issues](https://github.com/jean1880/agent-terminal/issues?q=is%3Aissue) and found no report of this.
          required: true
        - label: I can reproduce it on the [latest release](https://github.com/jean1880/agent-terminal/releases/latest) (or on `master`).
          required: true
        - label: I removed API keys, tokens, hostnames and anything else private from what I paste below.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Screenshots or a short recording help a lot with interface problems; drag them into this box.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From starting the app, as few steps as still show the problem.
      placeholder: |
        1. Start a Claude thread in a git repository
        2. Ask it to edit a file
        3. Open the diff panel (Ctrl+Shift+D) on "Last turn"
        4. ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Agent Terminal version
      description: "`dpkg -s agent-terminal | grep Version`, `rpm -q agent-terminal`, `pacman -Q agent-terminal`, or the commit (`git rev-parse --short HEAD`) for a source build."
      placeholder: "3.x.y"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - .deb (Debian, Ubuntu)
        - .rpm (Fedora)
        - Arch package
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      description: Distribution and version, desktop environment, and Wayland or X11.
      placeholder: "Ubuntu 24.04, GNOME 46, Wayland"
    validations:
      required: true

  - type: dropdown
    id: agents
    attributes:
      label: Agents involved
      description: Pick every agent the problem involves.
      multiple: true
      options:
        - Claude Code (claude)
        - Antigravity (agy)
        - Codex (codex)
        - A terminal thread or another CLI
        - None, it's the app itself

  - type: textarea
    id: agent-versions
    attributes:
      label: Agent CLI versions
      description: For problems in a thread. For agy, also say whether its approval hook is installed (Settings → Agents shows it).
      placeholder: |
        claude --version: 2.x.y
        agy --version: ...
        codex --version: ...
        agy approval hook: installed / not installed
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        The app's log around the time of the problem: `journalctl --user -t agent-terminal -b --since "15 min ago"`. For more detail, run it from a terminal with `RUST_LOG=debug agent-terminal`.

        ⚠️ **Read the log before posting.** It can contain paths, hostnames and, in rare cases, secrets in formats the app doesn't recognise.
      render: shell

  - type: input
    id: regression
    attributes:
      label: Last version that worked
      description: If this used to work, the last version where it did.

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Relevant settings from `~/.config/agent-terminal/config.json` (redacted), workarounds you found, or other context.
