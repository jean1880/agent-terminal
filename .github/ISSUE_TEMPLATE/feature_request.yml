# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Feature request
description: Suggest a new feature or a change to how something works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Start from the problem: what you're trying to do, and what gets in the way. That leads to a better design than starting from a solution.

        Agent Terminal ships no knowledge of any one machine. A check of a particular file or command often fits a [status indicator](https://github.com/jean1880/agent-terminal#status-indicators) or a [profile](https://github.com/jean1880/agent-terminal#profiles) already.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [open and closed issues](https://github.com/jean1880/agent-terminal/issues?q=is%3Aissue) and found no request for this.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what makes it hard today.
      placeholder: "When I run three threads at once, I can't tell which one is waiting for an approval without opening each..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How you picture it working. Mock-ups and examples from other apps are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways around the problem, including what you do today.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Chat threads and the sidebar
        - Approvals and rules
        - Switching agents and hand-offs
        - Delegation and sub-agents
        - Diffs, checkpoints, undo and worktrees
        - Terminals
        - Settings and appearance
        - Packaging and installation
        - Other

  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on it?
      description: Not required. If yes, we'll agree on the design here before you start.
      options:
        - "Yes, I'd like to open a pull request"
        - Maybe, with some guidance
        - "No"
