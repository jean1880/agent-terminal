# Weekly dependency updates. Minor and patch bumps arrive as one grouped PR per ecosystem;
# majors stay separate so each can be read on its own. The gtk-rs crates move in lockstep
# (gtk4, libadwaita, vte4, sourceview5 and glib-build-tools all pin the same glib), so they
# are grouped across every update type: a lone bump of one of them can never build.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      gtk-rs:
        patterns:
          - "gtk4"
          - "libadwaita"
          - "vte4"
          - "sourceview5"
          - "glib-build-tools"
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
